name: CI

# Pull requests only: a merged PR already passed here, so main isn't built again.
# Run it by hand from the Actions tab (CI > Run workflow) to check main itself.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  # A new push to the same PR cancels the run it replaces.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Test VisionOneKit
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        id: native-build
        run: |
          xcodebuild -project VisionOne.xcodeproj -scheme VisionOne \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath build/DerivedData build

      - name: Verify actual rendered media
        timeout-minutes: 10
        run: |
          'build/DerivedData/Build/Products/Debug/Vision One.app/Contents/MacOS/Vision One' --verify-media "$RUNNER_TEMP/vision-media"

      - name: Render native workspace fixtures
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          'build/DerivedData/Build/Products/Debug/Vision One.app/Contents/MacOS/Vision One' --verify-workspace "$RUNNER_TEMP/vision-media"

      - name: Preserve media verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-verification
          path: ${{ runner.temp }}/vision-media
          if-no-files-found: ignore

  release-rehearsal-guard:
    # The release rehearsal signs with the real keys, so it must never be
    # able to publish. This fails any change that would let it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the rehearsal can't publish
        run: scripts/release/check-rehearsal-workflow.sh
