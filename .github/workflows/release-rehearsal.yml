name: Release rehearsal

# A practice run of the release with the real keys: builds Vision One,
# signs it with the Developer ID certificate, notarises the app and the DMG
# with Apple, and signs the DMG with the Sparkle key, then checks each
# result. It publishes nothing: no tag, no GitHub release, no workflow
# artifact, no appcast, no Homebrew cask. The signed files are deleted when
# the job ends. Run it from the Actions tab on main: Release rehearsal →
# Run workflow. Setup and secrets: docs/RELEASING.md.
#
# Publishing is impossible here, not just skipped:
# - the job token can only read the repo (permissions below), so it can't
#   push a tag or create a release even by mistake;
# - HOMEBREW_TAP_TOKEN is never passed in, so the tap can't be reached;
# - nothing is uploaded with upload-artifact.
# scripts/release/check-rehearsal-workflow.sh checks these rules on every
# pull request (CI).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: macos-15
    timeout-minutes: 180 # Apple can take 45+ minutes per notarisation
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      OUT: build/rehearsal
      VERSION: 0.0.0
    steps:
      - name: Only from main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Rehearse from main, not $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number counts commits
          persist-credentials: false

      - name: Work out the build number
        run: |
          {
            echo "BUILD_NUMBER=$(git rev-list --count HEAD)"
            echo "DMG=$OUT/Vision-One-$VERSION-rehearsal.dmg"
          } >> "$GITHUB_ENV"

      - name: Check the release secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          missing=()
          for name in APPLE_TEAM_ID DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY_P8 \
                      NOTARY_KEY_ID NOTARY_ISSUER_ID SPARKLE_PRIVATE_KEY SPARKLE_PUBLIC_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Add these in Settings → Secrets and variables → Actions: ${missing[*]} (see docs/RELEASING.md)"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Load the Developer ID certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/rehearsal.keychain-db"
          password=$(uuidgen)
          echo "::add-mask::$password"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Write the notary and Sparkle keys
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-key.txt"
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle-key.txt"
            echo "NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8"
            echo "SPARKLE_PUBLIC_KEY=$SPARKLE_PUBLIC_KEY"
          } >> "$GITHUB_ENV"

      - name: Build and sign Vision One.app
        run: SIGN=1 scripts/release/build-app.sh

      - name: Check the app's signature
        run: |
          app="$OUT/Vision One.app"
          codesign --verify --deep --strict "$app"
          team=$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          if [[ "$team" != "$TEAM_ID" ]]; then
            echo "::error::The app is signed for team '$team', not APPLE_TEAM_ID."
            exit 1
          fi
          codesign -dv --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application' || {
            echo "::error::The app isn't signed with a Developer ID Application certificate."
            exit 1
          }
          embedded=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$app/Contents/Info.plist")
          if [[ "$embedded" != "$SPARKLE_PUBLIC_KEY" ]]; then
            echo "::error::The app's Sparkle public key doesn't match SPARKLE_PUBLIC_KEY."
            exit 1
          fi
          echo "| Developer ID signature, team matches | ✓ |" >> "$RUNNER_TEMP/summary.md"

      - name: Notarise the app
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          scripts/release/notarize.sh "$OUT/Vision One.app"
          echo "| App notarised, stapled, Gatekeeper accepts it | ✓ |" >> "$RUNNER_TEMP/summary.md"

      - name: Make and sign the DMG
        run: SIGN=1 scripts/release/make-dmg.sh "$OUT/Vision One.app" "$DMG"

      - name: Notarise the DMG
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          scripts/release/notarize.sh "$DMG"
          echo "| DMG signed, notarised, stapled | ✓ |" >> "$RUNNER_TEMP/summary.md"

      - name: Sign the DMG for Sparkle and check the key pair
        run: |
          scripts/release/check-sparkle-key.sh "$DMG"
          echo "| Sparkle signature checks out with SPARKLE_PUBLIC_KEY | ✓ |" >> "$RUNNER_TEMP/summary.md"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release rehearsal"
            echo
            echo "Nothing was published. The signed app and DMG are deleted at the end of this job."
            echo
            echo "| Check | |"
            echo "| --- | --- |"
            cat "$RUNNER_TEMP/summary.md" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the keys and the signed build
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle-key.txt" "$RUNNER_TEMP/developer-id.p12"
          if [[ -n "${KEYCHAIN:-}" ]]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -rf build
