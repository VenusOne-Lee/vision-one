name: Release

# Run it from the Actions tab: Release → Run workflow → type a version like
# 0.1.0. It builds, signs with Developer ID, notarises, makes the DMG,
# publishes a GitHub release with appcast.xml for Sparkle, and updates the
# Homebrew cask. Setup and secrets: docs/RELEASING.md.
#
# On pull requests that touch the release files it does a dry run instead:
# same build and DMG, ad hoc signed, with a throwaway Sparkle key, nothing
# published. The DMG is kept as a workflow artifact so you can try it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 0.1.0
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - packaging/**
      - project.yml

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ github.event_name != 'workflow_dispatch' }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      OUT: build/release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number counts commits

      - name: Work out the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$DRY_RUN" == true ]]; then
            VERSION=0.0.0
          else
            VERSION="${INPUT_VERSION#v}"
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::Release from main, not $GITHUB_REF."
              exit 1
            fi
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version should look like 0.1.0, not '$VERSION'."
            exit 1
          fi
          if [[ "$DRY_RUN" != true ]] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released. Pick the next version."
            exit 1
          fi
          {
            echo "VERSION=$VERSION"
            echo "BUILD_NUMBER=$(git rev-list --count HEAD)"
            echo "DMG=$OUT/Vision-One-$VERSION.dmg"
          } >> "$GITHUB_ENV"

      - name: Check the release secrets
        if: env.DRY_RUN != 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          missing=()
          for name in APPLE_TEAM_ID DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY_P8 \
                      NOTARY_KEY_ID NOTARY_ISSUER_ID SPARKLE_PRIVATE_KEY SPARKLE_PUBLIC_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Add these in Settings → Secrets and variables → Actions: ${missing[*]} (see docs/RELEASING.md)"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Load the Developer ID certificate
        if: env.DRY_RUN != 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(uuidgen)
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Write the notary and Sparkle keys
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          key_file="$RUNNER_TEMP/sparkle-key.txt"
          if [[ "$DRY_RUN" == true ]]; then
            # A throwaway ed25519 key in Sparkle's format (base64 of the
            # 32-byte seed and public key), so the dry run signs for real.
            openssl=$(brew --prefix openssl@3)/bin/openssl
            "$openssl" genpkey -algorithm ed25519 -out "$RUNNER_TEMP/dry.pem"
            "$openssl" pkey -in "$RUNNER_TEMP/dry.pem" -outform DER | tail -c 32 | base64 > "$key_file"
            public=$("$openssl" pkey -in "$RUNNER_TEMP/dry.pem" -pubout -outform DER | tail -c 32 | base64)
            echo "SPARKLE_PUBLIC_KEY=$public" >> "$GITHUB_ENV"
          else
            printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file"
            printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "SPARKLE_PUBLIC_KEY=$SPARKLE_PUBLIC_KEY" >> "$GITHUB_ENV"
          fi
          echo "SPARKLE_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Build Vision One.app
        run: SIGN=$([[ "$DRY_RUN" == true ]] && echo 0 || echo 1) scripts/release/build-app.sh

      - name: Notarise the app
        if: env.DRY_RUN != 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/release/notarize.sh "$OUT/Vision One.app"

      - name: Make the DMG
        run: SIGN=$([[ "$DRY_RUN" == true ]] && echo 0 || echo 1) scripts/release/make-dmg.sh "$OUT/Vision One.app" "$DMG"

      - name: Notarise the DMG
        if: env.DRY_RUN != 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/release/notarize.sh "$DMG"

      - name: Draft the GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
            --title "Vision One $VERSION" --generate-notes
          gh release view "v$VERSION" --json body -q .body > "$OUT/notes.md"

      - name: Write appcast.xml
        run: |
          [[ -f "$OUT/notes.md" ]] || echo "Dry run of the release pipeline." > "$OUT/notes.md"
          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$(basename "$DMG")" \
          NOTES="$OUT/notes.md" scripts/release/make-appcast.sh "$DMG" "$OUT/appcast.xml"
          cat "$OUT/appcast.xml"

      - name: Keep the DMG and appcast
        uses: actions/upload-artifact@v4
        with:
          name: vision-one-${{ env.VERSION }}
          path: |
            ${{ env.DMG }}
            ${{ env.OUT }}/appcast.xml
          if-no-files-found: error

      - name: Publish the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$VERSION" "$DMG" "$OUT/appcast.xml"
          gh release edit "v$VERSION" --draft=false --latest

      - name: Update the Homebrew cask
        if: env.DRY_RUN != 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::warning::No HOMEBREW_TAP_TOKEN, so the cask wasn't updated (docs/RELEASING.md)."
            exit 0
          fi
          scripts/release/update-cask.sh "$DMG"

      - name: Remove the keys
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle-key.txt" "$RUNNER_TEMP/dry.pem"
          if [[ -n "${KEYCHAIN:-}" ]]; then security delete-keychain "$KEYCHAIN" || true; fi
